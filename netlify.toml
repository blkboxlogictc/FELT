[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always re-fetch the service worker itself so PWA updates roll out
# immediately instead of users getting stuck on a stale worker.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The manifest rarely changes but shouldn't be cached for long either.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
